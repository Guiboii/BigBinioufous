security:
    password_hashers:
        App\Entity\User:
            algorithm: bcrypt
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        users_in_memory: { memory: null }
        in_database:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            provider: in_database

            form_login:
                login_path: join
                check_path : join
                default_target_path : desk

            logout:
                path: logout
                target: home

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        # Espaces de /desk/files (gestionnaire de fichiers façon Drive) :
        # un rôle par espace, lecture ET écriture soumises à la même règle
        # (contrairement à avant où la lecture de /desk/music était ouverte
        # à tout compte connecté). ROLE_ADMIN a accès à tous les espaces.
        - { path: ^/desk/files/music, roles: [ROLE_BINIOUFOUS, ROLE_ADMIN] }
        - { path: ^/desk/files/admin, roles: ROLE_ADMIN }
        - { path: ^/desk/files/accounting, roles: [ROLE_COMPTA, ROLE_ADMIN] }
        # Espace "autre" (PDF, images...) : lecture ouverte aux binioufous
        # comme musique/compta, mais écriture réservée aux admins (contrairement
        # aux autres espaces où lecture et écriture suivent la même règle),
        # gérée par FolderWriteVoter (Folder::WRITE_ROLES) plutôt qu'ici.
        - { path: ^/desk/files/other, roles: [ROLE_BINIOUFOUS, ROLE_ADMIN] }
        # Le reste de /desk n'exige aucun rôle métier particulier, juste
        # d'être connecté : IS_AUTHENTICATED_FULLY (attribut Symfony natif,
        # évalué sur le token d'authentification, pas sur un rôle) plutôt
        # qu'un ROLE_USER maison qu'il aurait fallu injecter en dur dans
        # User::getRoles() rien que pour ça (retiré le 2026-08-12, cf.
        # ROADMAP.md "ROLE_USER retiré").
        - { path: ^/desk, roles: IS_AUTHENTICATED_FULLY }
        # Gestion des morceaux/voix (écriture) réservée aux admins ; la liste
        # et la fiche d'un morceau (GET) restent publiques, non concernées.
        - { path: ^/music/new, roles: ROLE_ADMIN }
        - { path: ^/music/quick-upload, roles: ROLE_BINIOUFOUS }
        - { path: ^/music/[^/]+/edit, roles: ROLE_ADMIN }
        - { path: ^/music/[^/]+/voice, roles: ROLE_ADMIN }
        - { path: ^/music, methods: [DELETE], roles: ROLE_ADMIN }
