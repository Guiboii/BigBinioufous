# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    # MAILER_DSN n'est pas déclaré dans .env (commenté, cf. ROADMAP.md
    # "Emails fonctionnels", bloqué sans accès mail) : sans valeur de repli,
    # injecter ne serait-ce que MailerInterface fait planter tout le
    # conteneur (EnvNotFoundException), avant même le premier appel à
    # send(). Transport "null" officiel de Symfony (silencieux, n'envoie
    # rien nulle part) le temps que MAILER_DSN soit configuré pour de vrai.
    env(MAILER_DSN): 'null://null'
    mp3: '%kernel.project_dir%/public/uploads/music'
    voices_directory: '%kernel.project_dir%/public/uploads/music/voices'
    documents_directory: '%kernel.project_dir%/public/uploads/documents'
    pictures_directory : '%kernel.project_dir%/public/uploads/pictures'
    event_posters: '%kernel.project_dir%/public/uploads/events'

    # Adresse prévenue par mail à chaque nouvelle inscription (squelette,
    # cf. LoginController::notifyAdminsOfNewRegistration()) : PLACEHOLDER,
    # à remplacer par la vraie adresse de l'équipe. Volontairement en dur
    # plutôt que via un env var (%env(...)%) : .env est réservé aux vraies
    # valeurs de prod que ce projet ne committe jamais, ce paramètre-ci n'a
    # rien de secret et doit rester un placeholder visible tant que
    # MAILER_DSN lui-même n'est pas configuré (cf. ROADMAP.md "Emails
    # fonctionnels").
    admin_notification_email: 'contact@binioufous.fr'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # Filtre Twig |markdown_to_html (contenu Markdown éditable de la page
    # Histoire, cf. StorySection) : TwigExtraBundle câble déjà league/commonmark
    # automatiquement (présence détectée), reste seulement à ajouter le
    # strikethrough (~~texte~~, remplace les <s> en dur du contenu historique)
    # via le tag twig.markdown.league_extension qu'il collecte lui-même.
    League\CommonMark\Extension\Strikethrough\StrikethroughExtension:
        tags: ['twig.markdown.league_extension']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
