story:
    title: Istor
    nav_intro: "@intro"
    nav_who: "@piv ?"
    nav_what: "@petra ?"
    nav_why: "@perak ?"
    nav_contact: "@darempred"
    mobile_note: "Gwel eeunaet evit ar pellgomz : an handelv klok gant an endro 3D a c'hortoz ac'hanout war urzhiataer."
    intro: "Donemat war lec'hienn ar Binioufous, ar strollad sonerezh ar muiañ foll er c'halaksi (met ket hepken) !! Amañ e kavi an holl ditouroù diwar-benn ac'hanomp, ha ma fell dit e c'helli leuskel ur gemennadenn deomp, laouen e vimp 🙂"
    who_title: "Neuze, piv eo ar Binioufous…"
    who_ages_title: "Yaouank, ha kozh"
    who_ages_text: "Er Binioufous ez eus tud a bep oad hag a bep live. Bugale, deugantoù, tud vras… Gwir eo e vez tud ar skolioù muzik. N'hon eus ket gwelet c'hoazh un den en em deskiñ e-unan. Gortoz a reomp ac'hanout !!"
    who_instruments_title: "Hautbois, ha traoù all"
    who_instruments_text: "Evit ar muiañ eus ac'hanomp e seniomp hautbois, hep mar ebet ! Met ez eus ivez tuben, basson, ha meur a bezh sonerezh all… Karout a reomp seniñ kreñv, met n'eo ket kement all treut kennebeut, gant hor c'hentelioù. Karout a reomp seniñ a bep seurt, hen ha nevez. A-wechoù anavezet-mat, a-wechoù n'anavezomp nemetomp anezho, rak n'implijomp ket partiturioù, neuze ez adkemeromp alies evit deskiñ anezho."
    who_level_title: "Deskarded, ha barrekaion, netra nemet Binioufous !"
    who_level_text: "Ya, deskarded ha barrekaion. Evel-se emañ ar Binioufous, mesket-tout. Darn a zeu eus skolioù bras enorapl Lyon, darn a zeu eus skolioù bihan, darn a zeu a bell, darn a zeu war droad rak tost-tost int, darn a zeu gant o marc'h-houarn, ha re all gant ar bus. A-wechoù ne zeuont ket, ken. Gwir eo penn-da-benn ez ouezont c'hoari hag ez ant da zeskiñ atav. Ret e vefe goulenn dezho met me a gred eo evit-se e teuont."
    who_no_sheet_title: "Hep partitur, met gant son"
    who_no_sheet_text: "Ya, hep partitur. Evel-se emañ ar Binioufous, n'eus ket a bartitur ! Ha se a ro deomp gallout seniñ e pep lec'h, ha sellet ouzh an dud a-eeun en o daoulagad. Sellout mat, ha c'hwezhañ, ha c'hwezhañ… Fiñval, ha diskuizhañ. N'omp biken prennet a-dreñv ur skrid, ha ne ankounac'homp biken hor partiturioù. Setu ma vez lakoc'h hor sac'h."
    what_title: "Ar Binioufous, ur strollad hautbois, met ket kement…"
    what_intro_text: "Da gentañ, evit farsal hepken eo : adseniñ a reomp, evel strollad hautbois, tonioù brudet evel ABBA, Star Wars, pe ar Bee Gees. Ya, traoù kozh, met dañsal a raent atav !!"
    what_oboe_text: "Ha c'hoazh, dre ma'z omp ar muiañ hautboisourien (met laouen omp pa zeu ur benveg all d'hor c'heñveriañ), evit diskouez e c'heller c'hoari hautbois hag ober fentigell. Ret eo anzav ez eus abeg d'an dud da soñjal e vez ar hautboisourien un tammig start."
    what_instrument_text: "Rak ret eo anzav (ha keuz a zo deomp), hor hautbois ker (ha tuben ha basson a c'hoari ganeomp ivez) a chom pell diouzh soñj an dud. Sur eo abalamour n'eo ket alies gwelet er straed. Setu ez eomp er-maez, seniñ e pep lec'h, e pep amzer (pe dost) ha C'HWEZHAÑ KREÑV !!"
    history_title: "Fellout a ra dit gouzout istor wir ur strollad hautbois, ar Binioufous ?"
    history_ok: "Mat,"
    history_text: "Ur wech e oa ur c'helenner-soner anvet Guiboï. Un devezh e oa erruet en ur skol vuzik tost da Lyon. Neuze e kavas, e-touez an diskibien, pevar a oa en o eil derez. Div vaouez ha daou baotr. Neuze e c'houlennas outo mont a-gevret ha seniñ tonioù asambles. Petra ? met petra a c'hellfemp seniñ, kelenner ker ? Ne ouzon ket, met tonioù a garit, ar re a c'hellfec'h seniñ er straed, ar re a anavezfe an dud oc'h tremen ! Ha setu, kroget e oa an dra. Ar strollad a greskas, dre red an amzer e teuas sonerien all da genstrivañ ganto. Hiziv an deiz ez eus ugent a dud er Binioufous, hervez an aroñsadenn… Met mar fell dit gouzout piv eo ar Binioufous, gwel ivinell « Piv eo ar Binioufous ? »."
    why_title: "Ar Binioufous, evit petra ?"
    why_party_title: "Evit ar fest, sur !!"
    why_party_text: "Evel ma lavaromp, ar muiañ ac'hanomp a c'hoari hautbois. Karout a reomp ober fest ha kenrannañ hor c'harantez evit ar binvioù-mañ, graet « diarven » (ni a lavar « kaer »). N'omp ket start ha degemer a reomp sonerien all (memes ma n'omp ket atav prest da gompren an dud a c'hoari binvioù nebeutoc'h kaer eget hon hini…). Fellout a ra deomp kenrannañ hor sonerezh, hor c'henlabour, ha hor follentez. Setu :"
    why_li_concert: "fellout a ra dit ober fest hag aozañ ur c'hoñsertenn foll hag orin ? Dont a raimp aes e Rhône-Alpes, ret e vo kaozeal mar bez pelloc'h."
    why_li_teacher: "kelenner-soner out ha klask a rez un tammig follentez d'ober asambles gant da ziskibien ? Kas a raimp deoc'h hor restroù son (biskoazh partitur, gwir Binioufous !), adkemer a rit gant ho tiskibien, seniñ a rit tonioù ar Binioufous, ha dont a raimp seniñ ganeoc'h ivez !"
    why_li_school: "kelenner, renour, pe dilennad ar sevenadur out hag e vank dit un abadenn evit ar bloavezh a zeu ? Aozañ a raimp, evel just, kas a raimp deoc'h hor restroù ha dont a raimp ur wech, div wech, teir gwech (pe muioc'h) e-doug ar bloavezh evit lakaat tan (a-fed komz, ya !!)."
    why_li_clarinet: "klarinetour out ? Kinnig a reomp dit kentelioù hautbois !!"
    why_outro: "Ma n'ouzez ket c'hoazh petra ober gant ar Binioufous, kas deomp ur gemennadenn, bez e vo un tamm graet dija !!"

