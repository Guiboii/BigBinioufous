name: pipeline

on:
  push:
  pull_request:
    branches:
      - main_2026
      - master

permissions:
  contents: read

jobs:
  # --- Lint ---------------------------------------------------------------
  lint-php-twig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Lint PHP (PHP-CS-Fixer)
        run: composer cs-php
      - name: Lint Twig (Twig-CS-Fixer)
        run: composer cs-twig

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Lint JS (ESLint)
        run: npm run lint:js

  # --- Sécurité (après le lint) --------------------------------------------
  composer-audit:
    needs: [lint-php-twig, lint-js]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist
      - name: Full dependency audit
        run: composer audit

  npm-audit:
    needs: [lint-php-twig, lint-js]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=high

  dependency-review:
    needs: [lint-php-twig, lint-js]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

