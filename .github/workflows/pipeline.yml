name: pipeline

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  # --- Lint ---------------------------------------------------------------
  lint-php-twig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-scripts
      - name: Lint PHP (PHP-CS-Fixer)
        run: composer cs-php
      - name: Lint Twig (Twig-CS-Fixer)
        run: composer cs-twig
      - name: .env éphémère pour booter le kernel (jamais commité, juste pour ce job)
        run: |
          echo "APP_ENV=test" > .env
          echo 'DATABASE_URL="mysql://user:password@127.0.0.1:3306/app?serverVersion=5.7"' >> .env
      - name: Vérifie les fichiers de traduction (syntaxe + clés manquantes fr/en)
        run: |
          php bin/console lint:yaml translations/
          php bin/console debug:translation fr --only-missing
          php bin/console debug:translation en --only-missing
          # br exclu du check strict : Symfony embarque ses propres messages de
          # validation/sécurité en interne (fr/en...) mais pas en breton, donc
          # --only-missing y trouvera toujours du bruit venant du framework lui-même

  lint-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Lint JS (ESLint)
        run: npm run lint:js

  # --- Tests (après le lint) -----------------------------------------------
  tests-php:
    needs: [lint-php-twig, lint-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-scripts
      - name: .env éphémère pour booter le kernel (jamais commité, .env réel volontairement hors git)
        run: echo "APP_ENV=test" > .env
      - name: .env.test.local éphémère (SQLite fichier, jeté à la fin du job, jamais commité)
        run: echo 'DATABASE_URL="sqlite:///%kernel.project_dir%/var/test.db"' > .env.test.local
      - name: Télécharge les dépendances JS d'AssetMapper (assets/vendor/, gitignoré, nécessaire pour que les pages avec {{ importmap() }} rendent sans 500)
        run: php bin/console importmap:install
      - name: Run PHPUnit
        run: composer test

  # Tests de bout en bout (Playwright, tests/e2e/) : uniquement ce que PHPUnit
  # ne voit pas (JS, glisser-déposer, rendu). Base SQLite dédiée, recréée par
  # tests/e2e/global-setup.js, serveur php -S lancé par Playwright lui-même.
  tests-e2e:
    needs: [lint-php-twig, lint-js]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: |
          composer install --no-progress --prefer-dist --no-scripts
          npm ci
      - name: .env éphémère en env dev (jamais commité, secret jetable propre au job)
        run: |
          echo "APP_ENV=dev" > .env
          echo "APP_SECRET=$(openssl rand -hex 16)" >> .env
          echo "VAR_DUMPER_SERVER=127.0.0.1:9912" >> .env
          echo 'DATABASE_URL="sqlite:///%kernel.project_dir%/var/e2e.db"' >> .env
      - name: Télécharge les dépendances JS d'AssetMapper
        run: php bin/console importmap:install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm run test:e2e
      - name: Trace des tests en échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # --- Sécurité (après le lint) --------------------------------------------
  composer-audit:
    needs: [lint-php-twig, lint-js]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-scripts
      - name: Full dependency audit
        run: composer audit --abandoned=report

  npm-audit:
    needs: [lint-php-twig, lint-js]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Full dependency audit
        run: npm audit --audit-level=high

  dependency-review:
    needs: [lint-php-twig, lint-js]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # --- Déploiement (Phase 3 de ROADMAP.md) --------------------------------
  # Déploiement direct (pas de Docker) : connexion SSH au VPS, git pull,
  # migrations, recompilation des assets. Nécessite les secrets VPS_HOST,
  # VPS_USER, VPS_SSH_KEY, VPS_PATH (voir ROADMAP.md, Phase 3), et un clone
  # initial du repo déjà fait à la main sur le VPS.
  deploy:
    needs: [composer-audit, npm-audit, tests-php, tests-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH sur le VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # checkout master explicite : le clone du VPS a pu rester sur une
          # ancienne branche de prod, un simple "git pull" ne l'y ramènerait pas.
          # Pas de doctrine:migrations:migrate : le repo ne versionne aucune
          # migration, le schéma se pose via doctrine:schema:create au premier
          # déploiement (cf. doc/deploiement-vps.md). Les changements de schéma
          # ultérieurs se font à la main.
          script: |
            cd ${{ secrets.VPS_PATH }}
            git fetch origin master
            git checkout master
            git pull origin master
            composer install --no-dev --no-progress --prefer-dist --optimize-autoloader
            php bin/console importmap:install
            php bin/console asset-map:compile
            php bin/console cache:clear
